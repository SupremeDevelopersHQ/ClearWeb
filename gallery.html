<!DOCTYPE html>
<html>
<head>
  <title>Extracted Images - SupremeCopy+</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; text-align: center; }
    h1 { margin-top: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; padding: 20px; }
    .img-card { background: #1e293b; padding: 10px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; }
    img { max-width: 100%; max-height: 200px; object-fit: contain; margin-bottom: 10px; border-radius: 4px; }
    a { color: #3b82f6; text-decoration: none; font-size: 14px; font-weight: bold; background: #e2e8f0; color: #0f172a; padding: 6px 12px; border-radius: 4px; }
    a:hover { background: #cbd5e1; }
  </style>
</head>
<body>
  <h1>&#128444; Extracted Images</h1>
  <p>Right-click and save, or click the download button below each image.</p>
  <div class="grid" id="gallery"></div>
  <script src="gallery.js"></script>
</body>
</html>
